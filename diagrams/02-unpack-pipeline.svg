<svg xmlns="http://www.w3.org/2000/svg" width="980" height="900" viewBox="0 0 980 900" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<defs>
  <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#64748b"/>
  </marker>
  <style>
    .h{font-size:20px;font-weight:700;fill:#0f172a}
    .sub{font-size:12.5px;fill:#334155}
    .st{font-size:13.5px;font-weight:700;fill:#0f172a}
    .box{font-size:13px;font-weight:600;fill:#0f172a}
    .m{font-size:11.5px;fill:#334155;font-family:Consolas,monospace}
    .step{font-size:12px;font-weight:700;fill:#ffffff}
    .note{font-size:11.5px;fill:#475569}
  </style>
</defs>
<rect width="980" height="900" fill="#f8fafc"/>
<text x="30" y="38" class="h">CXD90045 固件包打包 / 解包全链路</text>
<text x="30" y="60" class="sub">五层结构，每层只做一件事。下图是从官方 BODYDATA.DAT 一路拆到根文件系统的完整路径，反向即为打包顺序。</text>

<!-- L0 -->
<rect x="30" y="80" width="700" height="54" rx="6" fill="#1e293b"/>
<text x="46" y="104" class="st" fill="#ffffff">L0　官方升级包</text>
<text x="46" y="124" class="m" fill="#cbd5e1">BODYDATA.DAT　（ZV-E10 Ver2.03 = 372,454,920 B）</text>

<line x1="380" y1="134" x2="380" y2="164" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
<rect x="600" y="136" width="130" height="26" rx="13" fill="#2563eb"/>
<text x="620" y="154" class="step">① 容器解析</text>
<text x="742" y="153" class="note">8B magic + 记录流 + DEND</text>

<!-- L1 -->
<rect x="30" y="168" width="700" height="86" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="192" class="st">L1　记录层（明文信封 + 密文内容）</text>
<text x="46" y="214" class="m">0000_* 0100_* 0110_backup 0300_partconf 0700_part_image …</text>
<text x="46" y="238" class="note">每条记录 = [u32be 长度][4B ASCII 类型][数据]。记录互相独立，可只取所需。</text>

<line x1="380" y1="254" x2="380" y2="284" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
<rect x="600" y="256" width="130" height="26" rx="13" fill="#2563eb"/>
<text x="620" y="274" class="step">② 两段解密</text>

<!-- L2 -->
<rect x="30" y="288" width="700" height="108" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="312" class="st">L2　加密层（两种算法，按位置切分）</text>
<rect x="46" y="324" width="300" height="58" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
<text x="58" y="344" class="box">前 512 B</text>
<text x="58" y="362" class="m">AES-128-ECB（全平台同一把 key_aes）</text>
<text x="58" y="376" class="note">位置固定、长度固定、与机型无关</text>
<rect x="360" y="324" width="340" height="58" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
<text x="372" y="344" class="box">其余部分</text>
<text x="372" y="362" class="m">AES-256-CBC（机型密钥 + IV）</text>
<text x="372" y="376" class="note">IV 取自 DAT 偏移 N-0x110；密钥因机型而异</text>

<line x1="380" y1="396" x2="380" y2="426" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
<rect x="600" y="398" width="130" height="26" rx="13" fill="#2563eb"/>
<text x="620" y="416" class="step">③ 分帧还原</text>

<!-- L3 -->
<rect x="30" y="430" width="700" height="118" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="454" class="st">L3　分帧层（防传输损坏的定长帧）</text>
<text x="46" y="476" class="m">[u16 checksum LE][u16 sizeAndEnd LE][payload ≤1020 B][0xFF 填充]　→ 每帧固定 1024 B</text>
<text x="46" y="498" class="note">checksum = Σ(从 +2 起的 511 个小端 u16) &amp; 0xFFFF；sizeAndEnd 的 bit15 = 末帧标志</text>
<text x="46" y="520" class="m">ZV-E10: 363,725 帧 × 1024 B + 272 B 尾部</text>
<text x="46" y="538" class="note">★ 272 B 尾部必须原样复制，绝不可重新加密 —— 这是回打包最容易踩的坑</text>

<line x1="380" y1="548" x2="380" y2="578" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
<rect x="600" y="550" width="130" height="26" rx="13" fill="#2563eb"/>
<text x="620" y="568" class="step">④ 定位载荷</text>

<!-- L4 -->
<rect x="30" y="582" width="700" height="118" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="606" class="st">L4　载荷头（明文 FDAT）</text>
<text x="46" y="628" class="m">+0x00  "UDTRFIRM"　+0x24  机型 ID　+0x30  fwOffset = 0x24200</text>
<text x="46" y="650" class="note">ZV-E10 明文 370,998,784 B。机型 ID 是区分机型的关键字段。</text>
<text x="46" y="672" class="m">0x24200 起：ustar 归档（ZV-E10 共 174 条目）</text>

<line x1="380" y1="700" x2="380" y2="730" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
<rect x="600" y="702" width="130" height="26" rx="13" fill="#059669"/>
<text x="620" y="720" class="step">⑤ 解 tar</text>

<!-- L5 -->
<rect x="30" y="734" width="700" height="132" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="46" y="758" class="st">L5　分区镜像 → 根文件系统</text>
<text x="46" y="780" class="m">nflasha1 / nflasha3 / nflasha7 / nflasha15　→　/usr 树</text>
<text x="46" y="802" class="note">ZV-E10：973 文件 / 215.6 MB　　　ZV-1F：4,011 文件 / 309.8 MB</text>
<text x="46" y="826" class="note">这一步之后才是真正的研究对象：库、驱动、UI 资源、语言包、字体。</text>
<text x="46" y="852" class="m">★ 每分区另有 .sum CSV 清单（ZV-E10 共 130 项）供相机侧二次校验</text>

<!-- right side: key insight -->
<rect x="750" y="80" width="200" height="786" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="766" y="106" class="st">这条链路的设计意图</text>

<text x="766" y="136" class="note">分层的目的是把</text>
<text x="766" y="153" class="note">不同性质的失败隔开：</text>

<text x="766" y="182" class="box">L1 容器</text>
<text x="766" y="199" class="note">管"有没有取对记录"</text>

<text x="766" y="224" class="box">L2 加密</text>
<text x="766" y="241" class="note">管"是不是这台机器"</text>

<text x="766" y="266" class="box">L3 分帧</text>
<text x="766" y="283" class="note">管"传输有没有坏块"</text>
<text x="766" y="300" class="note">（逐帧独立，可局部重传）</text>

<text x="766" y="325" class="box">L4 载荷头</text>
<text x="766" y="342" class="note">管"载荷是哪台机型"</text>

<text x="766" y="367" class="box">L5 文件系统</text>
<text x="766" y="384" class="note">管"文件级完整性"</text>
<text x="766" y="401" class="note">（.sum 清单）</text>

<line x1="766" y1="424" x2="934" y2="424" stroke="#bfdbfe"/>
<text x="766" y="450" class="st">对研究者的含义</text>
<text x="766" y="474" class="note">三层校验互相独立，</text>
<text x="766" y="491" class="note">所以可以分层验证：</text>
<text x="766" y="514" class="note">只解 L1+L2 → 能看文法</text>
<text x="766" y="531" class="note">加 L3 → 能拿到明文</text>
<text x="766" y="548" class="note">加 L4 → 能定位 tar</text>
<text x="766" y="565" class="note">加 L5 → 能拿到文件</text>

<line x1="766" y1="588" x2="934" y2="588" stroke="#bfdbfe"/>
<text x="766" y="614" class="st">回打包的关键约束</text>
<text x="766" y="638" class="note">① 尾部 272 B 原样保留</text>
<text x="766" y="655" class="note">② 帧 checksum 必重算</text>
<text x="766" y="672" class="note">③ DEND CRC-32 必重算</text>
<text x="766" y="689" class="note">④ 被改动分区的 .sum</text>
<text x="766" y="706" class="note">　 必须同步更新</text>
<text x="766" y="729" class="note">四条任一漏掉，</text>
<text x="766" y="746" class="note">都会在某个环节被拒。</text>

<rect x="766" y="766" width="168" height="78" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
<text x="778" y="788" class="note" fill="#991b1b">未验证的改动</text>
<text x="778" y="805" class="note" fill="#991b1b">不要刷机。</text>
<text x="778" y="822" class="note" fill="#991b1b">先做静态校验，</text>
<text x="778" y="839" class="note" fill="#991b1b">再考虑上机。</text>
</svg>