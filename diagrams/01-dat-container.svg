<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<defs>
  <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 z" fill="#475569"/>
  </marker>
  <style>
    .t{font-size:15px;font-weight:700;fill:#0f172a}
    .h{font-size:20px;font-weight:700;fill:#0f172a}
    .st{font-size:13px;font-weight:600;fill:#0f172a}
    .n{font-size:12px;fill:#334155}
    .m{font-size:11.5px;fill:#475569;font-family:Consolas,monospace}
    .w{font-size:12px;fill:#ffffff;font-weight:600;font-family:Consolas,monospace}
  </style>
</defs>
<rect width="920" height="600" fill="#f8fafc"/>
<text x="30" y="38" class="h">DAT 容器结构 / BODYDATA.DAT container layout</text>
<text x="30" y="60" class="n">Sony CXD90045 平台升级包。整体是「8 字节魔数 + 记录流 + 终止符」的极简容器。</text>

<!-- magic -->
<rect x="30" y="82" width="560" height="46" rx="4" fill="#1e293b"/>
<text x="42" y="111" class="w">89 55 46 55 0D 0A 1A 0A</text>
<text x="250" y="111" class="w">[8 B MAGIC]</text>
<text x="610" y="100" class="st">魔数</text>
<text x="610" y="118" class="n">8 字节，全平台固定</text>

<!-- record stream -->
<rect x="30" y="140" width="560" height="150" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
<text x="42" y="163" class="st">记录流（可重复 N 次 / repeatable records）</text>

<rect x="42" y="175" width="86" height="30" rx="3" fill="#2563eb"/>
<text x="50" y="196" class="w">u32be size</text>
<text x="136" y="196" class="m">012C 0000</text>

<rect x="200" y="175" width="70" height="30" rx="3" fill="#7c3aed"/>
<text x="208" y="196" class="w">4B type</text>
<text x="278" y="196" class="m">「0700」</text>

<rect x="330" y="175" width="240" height="30" rx="3" fill="#059669"/>
<text x="340" y="196" class="w">data (size 字节)</text>

<rect x="42" y="213" width="86" height="30" rx="3" fill="#2563eb"/>
<text x="50" y="234" class="w">u32be size</text>
<rect x="200" y="213" width="70" height="30" rx="3" fill="#7c3aed"/>
<text x="208" y="234" class="w">4B type</text>
<text x="278" y="234" class="m">「0300」</text>
<rect x="330" y="213" width="150" height="30" rx="3" fill="#059669"/>
<text x="340" y="234" class="w">data</text>
<text x="490" y="234" class="m">…</text>

<rect x="42" y="251" width="86" height="30" rx="3" fill="#2563eb"/>
<rect x="200" y="251" width="70" height="30" rx="3" fill="#7c3aed"/>
<rect x="330" y="251" width="240" height="30" rx="3" fill="#059669"/>
<text x="340" y="272" class="w">… 共 N 条记录</text>

<!-- terminator -->
<rect x="30" y="300" width="560" height="52" rx="4" fill="#dc2626"/>
<text x="42" y="322" class="w">u32be 4</text>
<text x="140" y="322" class="w">「DEND」</text>
<text x="250" y="322" class="w">u32be CRC32</text>
<text x="42" y="342" class="n" fill="#fee2e2">终止符：长度恒为 4，类型恒为 DEND，末 4 字节是整包的 CRC-32</text>

<!-- right annotations -->
<rect x="612" y="140" width="278" height="212" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="626" y="164" class="st">记录类型（type 字段）</text>
<text x="626" y="186" class="m">0000_xxxx  包元信息</text>
<text x="626" y="206" class="m">0100_xxxx  主数据段</text>
<text x="626" y="226" class="m">0110_backup 备份分区载荷</text>
<text x="626" y="246" class="m">0300_partconf 分区表配置</text>
<text x="626" y="266" class="m">0700_part_image 分区镜像</text>
<text x="626" y="290" class="m">08xx_…  机型设置 / kemco.txt</text>
<text x="626" y="314" class="n">类型是 4 字节 ASCII，前 4 位是编号，后缀是语义名。</text>
<text x="626" y="332" class="n">编号决定处理顺序，语义名决定用途。</text>

<!-- bottom: why it matters -->
<rect x="30" y="376" width="860" height="200" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
<text x="46" y="400" class="st">这样一个极简容器，为什么值得研究</text>
<text x="46" y="426" class="n">1. 没有魔数校验表、没有版本兼容分支、没有压缩层 —— 解析成本极低，几十行代码即可完整拆开。</text>
<text x="46" y="450" class="n">2. 记录之间相互独立、长度自描述 —— 可以只取需要的记录（例如只取 0300 分区配置或 0700 单个分区镜像），</text>
<text x="62" y="470" class="n">不必解密整包。这对「只关心 UI 资源」的研究非常关键。</text>
<text x="46" y="494" class="n">3. 完整性只由终止符里的一个 CRC-32 承担 —— 意味着校验边界完全明确、可独立验证。</text>
<text x="46" y="518" class="n">4. 加密与容器解耦 —— 容器本身不含任何密钥字段；密钥来自设备侧，不与包一起分发。</text>
<text x="46" y="548" class="t">→ 结论：容器是"透明的抽屉"，真正的门槛在下一层的加密与分帧，而不在容器。</text>
</svg>