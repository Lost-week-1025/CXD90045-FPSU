<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<defs><style>
  .h{font-size:20px;font-weight:700;fill:#0f172a}
  .sub{font-size:12.5px;fill:#334155}
  .st{font-size:14px;font-weight:700;fill:#0f172a}
  .box{font-size:12.5px;font-weight:600;fill:#0f172a}
  .m{font-size:11px;fill:#334155;font-family:Consolas,monospace}
  .note{font-size:11.5px;fill:#475569}
  .w{font-size:12px;fill:#ffffff;font-weight:600}
  .big{font-size:15px;font-weight:700;fill:#0f172a}
</style></defs>
<rect width="1000" height="760" fill="#f8fafc"/>
<text x="30" y="38" class="h">ZV-E10 与 ZV-1F 的 UI 架构：两种范式，同一个框架</text>
<text x="30" y="60" class="sub">现象上差异巨大（数据驱动 vs 单体），但底层用的是同一套 ux 框架、同一批抽象库、同一容器格式。</text>

<!-- ZV-E10 -->
<rect x="30" y="82" width="450" height="330" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="30" y="82" width="450" height="34" rx="6" fill="#2563eb"/>
<text x="46" y="105" class="w" fill="#ffffff">ZV-E10　viewUnified 世代（数据驱动）</text>

<rect x="48" y="130" width="414" height="34" rx="3" fill="#dbeafe"/>
<text x="58" y="152" class="box">bin/im.elf　主程序（23,240 B）</text>
<rect x="48" y="170" width="414" height="34" rx="3" fill="#dbeafe"/>
<text x="58" y="192" class="box">libObj.so　框架库 20.8 MB（3,386 导出符号）</text>
<rect x="48" y="210" width="414" height="34" rx="3" fill="#bfdbfe"/>
<text x="58" y="232" class="box">viewUnified2..8.so　渲染库 8 个，共 19.6 MB</text>
<rect x="48" y="250" width="414" height="34" rx="3" fill="#93c5fd"/>
<text x="58" y="272" class="box">214 个 view*.uxc　视图定义（数据）</text>
<rect x="48" y="290" width="414" height="34" rx="3" fill="#60a5fa"/>
<text x="58" y="312" class="w">语义命名位图　image_cmn_43 / image_Fn_Menu_43 …</text>
<rect x="48" y="330" width="414" height="34" rx="3" fill="#e0e7ff"/>
<text x="58" y="352" class="box">libBizFw.so / libBizFw2.so　业务框架</text>
<rect x="48" y="370" width="414" height="30" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="58" y="390" class="note">global.xdb 注册 313 条 → 其中 230+ 是视图文件</text>

<!-- ZV-1F -->
<rect x="520" y="82" width="450" height="330" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
<rect x="520" y="82" width="450" height="34" rx="6" fill="#059669"/>
<text x="536" y="105" class="w" fill="#ffffff">ZV-1F　appFw 世代（单体 + 竖屏）</text>

<rect x="538" y="130" width="414" height="34" rx="3" fill="#d1fae5"/>
<text x="548" y="152" class="box">bin/im.elf　主程序（同尺寸，内容不同）</text>
<rect x="538" y="170" width="414" height="34" rx="3" fill="#a7f3d0"/>
<text x="548" y="192" class="box">libObj.so　仅 3.8 MB（954 导出符号）</text>
<rect x="538" y="210" width="414" height="34" rx="3" fill="#6ee7b7"/>
<text x="548" y="232" class="box">appFw.so　51.9 MB 单体，视图内嵌于此</text>
<rect x="538" y="250" width="414" height="34" rx="3" fill="#fef3c7"/>
<text x="548" y="272" class="box">0 个 view*.uxc　（视图不落盘）</text>
<rect x="538" y="290" width="414" height="34" rx="3" fill="#fde68a"/>
<text x="548" y="312" class="w" fill="#78350f">数字编号位图　image_00_43 / image_00_34 …</text>
<rect x="538" y="330" width="414" height="34" rx="3" fill="#fcd34d"/>
<text x="548" y="352" class="w" fill="#78350f">★ 竖屏变体　image_*_34 + string_*_vertical/_horizontal</text>
<rect x="538" y="370" width="414" height="30" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="558" y="390" class="note">global.xdb 仅注册 154 条 → 0 条视图</text>

<!-- middle: shared -->
<rect x="30" y="432" width="940" height="118" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="46" y="458" class="st">两机真正共用的部分（这部分是移植的立足点）</text>
<text x="46" y="484" class="m">ux::wgtsys（控件/事件/手势）　ux::wgtlay（布局/动画）　ux::gfxeng（绘制/文字）　ux::resmgr（资源）</text>
<text x="46" y="508" class="m">libMWF · libmintx · libSysDef · libIMDB · libptp · libosal_uipc · libBackupManager　→　导出符号 100% 相同</text>
<text x="46" y="532" class="m">.uxc 容器格式完全一致（master_camera.uxc 头部 u16 表逐字节相同）</text>

<!-- bottom: ABI table -->
<rect x="30" y="566" width="940" height="170" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="46" y="592" class="st">导出符号重合度（决定移植边界）</text>

<text x="46" y="618" class="box">100%</text>
<text x="110" y="618" class="m">libMWF 1544/1544　libmintx 10785/10785　libSysDef 24/24　libIMDB 10/10　libptp 259/259</text>
<rect x="46" y="624" width="908" height="6" rx="3" fill="#059669"/>

<text x="46" y="654" class="box">~98%</text>
<text x="110" y="654" class="m">dataflowInfraFramework 1416/1434　libJiritsu 203/204</text>
<rect x="46" y="660" width="890" height="6" rx="3" fill="#10b981"/>

<text x="46" y="690" class="box">63.5%</text>
<text x="110" y="690" class="m">libInfraFsys 947/1492（文件系统抽象层变化较大）</text>
<rect x="46" y="696" width="577" height="6" rx="3" fill="#f59e0b"/>

<text x="46" y="726" class="box">24.1%</text>
<text x="110" y="726" class="m">libObj 815/954（UI 框架本体 —— 就是要换的那一层）</text>
<rect x="46" y="732" width="219" height="6" rx="3" fill="#dc2626"/>
</svg>