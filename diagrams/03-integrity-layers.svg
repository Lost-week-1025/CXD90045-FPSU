<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<defs><style>
  .h{font-size:20px;font-weight:700;fill:#0f172a}
  .sub{font-size:12.5px;fill:#334155}
  .st{font-size:14px;font-weight:700;fill:#0f172a}
  .box{font-size:13px;font-weight:600;fill:#0f172a}
  .m{font-size:11.5px;fill:#334155;font-family:Consolas,monospace}
  .note{font-size:11.5px;fill:#475569}
  .tag{font-size:11px;font-weight:700;fill:#ffffff}
</style></defs>
<rect width="940" height="640" fill="#f8fafc"/>
<text x="30" y="38" class="h">三层完整性校验：谁在验、验什么、什么时候验</text>
<text x="30" y="60" class="sub">三层互相独立、覆盖范围不同、执行主体不同。任何改动必须同时满足全部三层。</text>

<!-- L1 -->
<rect x="30" y="82" width="880" height="140" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="30" y="82" width="118" height="140" rx="6" fill="#2563eb"/>
<text x="48" y="112" class="tag">L1</text>
<text x="48" y="136" class="tag">DEND</text>
<text x="48" y="158" class="tag">CRC-32</text>
<text x="166" y="112" class="st">整包级 —— 由 PC 侧升级器验证</text>
<text x="166" y="138" class="m">算法：标准 CRC-32（zlib 多项式 0xEDB88320）</text>
<text x="166" y="160" class="m">覆盖：[0, filesize-12)　即除终止符末 12 字节外的全部内容</text>
<text x="166" y="182" class="m">存放：终止符最后 4 字节，大端（big-endian）</text>
<text x="166" y="206" class="note">★ 这是唯一一个"整包"级别的校验。改任何 1 bit 都会让它失配。</text>

<!-- L2 -->
<rect x="30" y="238" width="880" height="150" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
<rect x="30" y="238" width="118" height="150" rx="6" fill="#059669"/>
<text x="48" y="268" class="tag">L2</text>
<text x="48" y="292" class="tag">.sum</text>
<text x="48" y="314" class="tag">CSV 清单</text>
<text x="166" y="268" class="st">分区级 —— 由相机侧验证</text>
<text x="166" y="294" class="m">形态：每个 NN00_X 分区对应 NN01_X_sum 目录，内含逐文件 CSV 清单</text>
<text x="166" y="316" class="m">ZV-E10 共 130 项</text>
<text x="166" y="340" class="m">行格式：type,crc32,size,mtime,0,0x3e8,owner,group,-1,-1,name,</text>
<text x="166" y="362" class="m">type: 0 = 文件　5 = 目录</text>
<text x="166" y="384" class="note">★ 命名规则：sum 目录名 = 原分区名前 4 位数字末位减 1，再剥掉 _sum 后缀</text>

<!-- L3 -->
<rect x="30" y="404" width="880" height="130" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<rect x="30" y="404" width="118" height="130" rx="6" fill="#d97706"/>
<text x="48" y="434" class="tag">L3</text>
<text x="48" y="458" class="tag">帧</text>
<text x="48" y="480" class="tag">checksum</text>
<text x="166" y="434" class="st">帧级 —— 由引导 / 更新流程验证</text>
<text x="166" y="460" class="m">形态：每 1024 B 一帧，帧内 16 bit 求和校验</text>
<text x="166" y="482" class="m">checksum = Σ(从帧内 +2 起的 511 个 LE u16) &amp; 0xFFFF</text>
<text x="166" y="504" class="m">ZV-E10 共 363,725 帧</text>
<text x="166" y="526" class="note">★ 逐帧独立 —— 设计意图是允许局部重传，而不是防篡改。</text>

<!-- bottom -->
<rect x="30" y="552" width="880" height="66" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
<text x="48" y="576" class="st" fill="#991b1b">改动任一字节，需要同时处理：</text>
<text x="48" y="600" class="note" fill="#991b1b">① 重算该帧 checksum　② 重算 DEND CRC-32　③ 若改了分区内文件，同步更新对应 .sum 清单</text>
</svg>